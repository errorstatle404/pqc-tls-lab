# PQC TLS Lab — four endpoints that differ ONLY in key exchange / signature config.
#
#   :8443  hybrid         X25519MLKEM768 preferred, classical fallback  ECDSA P-256 cert
#   :8446  hybrid-strict  same groups, but hybrid ENFORCED via HRR      ECDSA P-256 cert
#   :8444  classical      X25519 / P-256 only                           ECDSA P-256 cert
#   :8445  pq-only        ML-KEM-1024 only                              ML-DSA-65 cert
#
# Requires nginx linked against OpenSSL >= 3.5 (native ML-KEM / ML-DSA, no oqs-provider).

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    default_type text/plain;
    server_tokens off;

    # Log the negotiated group so you can prove what happened from the server side.
    # $ssl_curve reports the key-exchange group (e.g. X25519MLKEM768); port identifies the endpoint.
    log_format tls '$remote_addr [$time_local] "$request" $status '
                   'proto=$ssl_protocol cipher=$ssl_cipher port=$server_port group=$ssl_curve';
    access_log /dev/stdout tls;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache off;          # every connection is a full handshake -> fair measurements
    ssl_session_tickets off;

    # ---------- 1. Hybrid (the realistic 2025/26 deployment) ----------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/pqc-lab/certs/ecdsa/fullchain.crt;
        ssl_certificate_key /etc/pqc-lab/certs/ecdsa/leaf.key;
        # Hybrid is listed first, but OpenSSL will still accept a classical key share
        # the client already sent instead of forcing a retry (see 1b). Classical
        # groups stay for clients without ML-KEM.
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
        location / {
            return 200 "endpoint=hybrid group=$ssl_curve cipher=$ssl_cipher\n";
        }
    }

    # ---------- 1b. Hybrid, strictly enforced ----------
    # OpenSSL 3.5 group-list syntax: '/' separates preference *tuples*.
    # With a plain ':' list (endpoint 1), the server will happily accept a classical
    # X25519 key share the client already sent rather than ask for the hybrid one.
    # Putting X25519MLKEM768 in its own first tuple makes the server send a
    # HelloRetryRequest to get a hybrid share whenever the client supports it
    # (one extra round trip), while still falling back for classical-only clients.
    server {
        listen 8446 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/pqc-lab/certs/ecdsa/fullchain.crt;
        ssl_certificate_key /etc/pqc-lab/certs/ecdsa/leaf.key;
        ssl_ecdh_curve X25519MLKEM768/X25519:prime256v1;
        location / {
            return 200 "endpoint=hybrid-strict group=$ssl_curve cipher=$ssl_cipher\n";
        }
    }

    # ---------- 2. Classical baseline ----------
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/pqc-lab/certs/ecdsa/fullchain.crt;
        ssl_certificate_key /etc/pqc-lab/certs/ecdsa/leaf.key;
        ssl_ecdh_curve X25519:prime256v1;
        location / {
            return 200 "endpoint=classical group=$ssl_curve cipher=$ssl_cipher\n";
        }
    }

    # ---------- 3. Pure post-quantum (experimental; no browser supports this yet) ----------
    server {
        listen 8445 ssl;
        http2 on;
        server_name _;
        ssl_certificate     /etc/pqc-lab/certs/mldsa/fullchain.crt;
        ssl_certificate_key /etc/pqc-lab/certs/mldsa/leaf.key;
        ssl_ecdh_curve MLKEM1024;
        location / {
            return 200 "endpoint=pq-only group=$ssl_curve cipher=$ssl_cipher\n";
        }
    }
}
